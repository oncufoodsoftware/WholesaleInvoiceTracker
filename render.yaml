services:
  - type: web
    name: wholesale-invoice-tracker
    runtime: node
    region: frankfurt  # Change to your preferred region
    plan: free         # Change to 'starter' or higher for production
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # Set this secret in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true   # Render auto-generates a secure random value
      - key: OPENAI_API_KEY
        sync: false   # Optional: set in Render dashboard if using AI features
